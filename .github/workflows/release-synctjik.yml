name: Release synctjik binary
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed synctjik release tag
        required: true
        type: string
  push:
    tags: ['synctjik-v*']
permissions:
  contents: write
jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref }}
          sparse-checkout: |
            apps/synctjik
            packages/tjik-ui
      - name: Install release build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools age zstd python3-cryptography
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
      - name: Test archive and merge compatibility
        run: |
          cargo test --locked --manifest-path apps/synctjik/Cargo.toml
          python3 -B -m unittest discover -s apps/synctjik/tests -p test_terminal.py -v
      - name: Build and verify the static binary
        run: bash apps/synctjik/scripts/release.sh
      - name: Publish versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cat > /tmp/synctjik-release-notes.md <<'NOTES'
          Static Linux x86_64 synctjik binary for Fedora bootstrap. Download the executable directly; no compiler or archive tools are needed on the target machine.

          SHA256SUMS verifies the assets. build-info.json records the exact source commit, target and compiler. The bootstrap script independently pins the executable checksum.
          NOTES
          case "$RELEASE_TAG" in synctjik-v*) ;; *) exit 2 ;; esac
          gh release create "$RELEASE_TAG" apps/synctjik/dist/release/* \
            --verify-tag --target "$(git rev-parse HEAD)" --title "$RELEASE_TAG" \
            --notes-file /tmp/synctjik-release-notes.md --prerelease --latest=false
