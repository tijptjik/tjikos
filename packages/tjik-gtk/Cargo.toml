[package]
name = "tjik-gtk"
version = "0.1.0"
edition = "2021"
description = "Reusable GTK4 desktop presentation primitives with bounded image loading"
readme = "README.md"
repository = "https://github.com/tijptjik/tjikos"
publish = ["crates-io"]
license = "MPL-2.0"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
gtk4-layer-shell = "0.7"
serde = { version = "1", features = ["derive"] }
