[package]
name = "whatsover-relay"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
async-channel = "2"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1"
futures-util = "0.3"
ipnet = "2"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "66a6aa479b79cde35be6d05da0fa987a4b574d46", default-features = false, features = ["voip-relay-native"] }

[dev-dependencies]
tokio-tungstenite = "0.29"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
