[package]
name = "tjik-desktop"
version = "0.1.0"
edition = "2021"
authors = ["tijptjik"]
description = "Toolkit-independent desktop state and action contracts with compositor adapters"
readme = "README.md"
license = "MPL-2.0 AND BSD-3-Clause"
repository = "https://github.com/tijptjik/tjikos"
publish = ["crates-io"]

[features]
capture = ["dep:wayland-client", "dep:wayland-scanner", "dep:wayland-protocols-wlr", "dep:memmap2", "dep:tempfile", "dep:libc", "dep:bitflags", "dep:wayland-backend"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

wayland-client = { version = "0.31", optional = true }
wayland-scanner = { version = "0.31", optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
memmap2 = { version = "0.9", optional = true }
tempfile = { version = "3", optional = true }
libc = { version = "0.2", optional = true }

bitflags = { version = "2", optional = true }
wayland-backend = { version = "0.3", optional = true }
