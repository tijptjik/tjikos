[package]
name = "tjik-task-gtk"
version = "0.1.0"
edition = "2021"
authors = ["tijptjik"]
license = "MPL-2.0"
description = "Tasktjik GTK views with host-owned commands and asynchronous preview providers"
readme = "README.md"
repository = "https://github.com/tijptjik/tjikos"
publish = false
[dependencies]
tjik-gtk = { path = "../tjik-gtk", version = "0.1.0" }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
