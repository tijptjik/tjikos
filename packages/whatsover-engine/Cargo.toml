[package]
name = "whatsover-engine"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib"]

[[bin]]
name = "whatsover"
path = "src/bin/whatsover.rs"
required-features = ["native"]

[features]
default = ["native"]
native = ["whatsapp-rust/default", "dep:whatsapp-rust-sqlite-storage", "dep:diesel", "dep:tokio", "dep:clap", "dep:qrcode"]

[dependencies]
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "66a6aa479b79cde35be6d05da0fa987a4b574d46", default-features = false }
wacore = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "66a6aa479b79cde35be6d05da0fa987a4b574d46", default-features = false }
waproto = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "66a6aa479b79cde35be6d05da0fa987a4b574d46", features = ["serde-deserialize"] }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
whatsapp-rust-sqlite-storage = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "66a6aa479b79cde35be6d05da0fa987a4b574d46", optional = true, features = ["bundled-sqlite"] }
diesel = { version = "2.3.14", default-features = false, features = ["sqlite", "32-column-tables"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
