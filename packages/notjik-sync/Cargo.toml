[package]
name = "notjik-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"
libc = "0.2"
url = "2"
