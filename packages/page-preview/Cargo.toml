[package]
name = "tjik-page-preview"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "page-preview"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
url = "2"
scraper = "0.24"
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
signal-hook = "0.3"
libc = "0.2"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
