[package]
name = "notjik-api"
version = "0.1.0"
edition = "2021"

[dependencies]
notjik-sync = { path = "../../packages/notjik-sync" }
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
toml = "0.8"
percent-encoding = "2"
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["timeout", "limit"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "form"] }
base64 = "0.22"
tempfile = "3"
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
