[package]
name = "notjik-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[features]
gtk-ui = ["dep:gtk", "dep:tjik-gtk", "dep:gtk4-layer-shell", "dep:tjik-desktop"]

[[bin]]
name = "notjik-gtk"
path = "src/gtk/main.rs"
required-features = ["gtk-ui"]

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"], optional = true }
gtk4-layer-shell = { version = "0.7", optional = true }
tjik-gtk = { path = "../../packages/tjik-gtk", optional = true }
tjik-desktop = { path = "../../packages/tjik-desktop", optional = true }
notjik-sync = { path = "../../packages/notjik-sync" }
anyhow = "1"
serde_json = "1"
rusqlite = "0.32"
libc = "0.2"
sha2 = "0.10"
regex = "1"
fancy-regex = "0.16"
url = "2"
tempfile = "3"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
base64 = "0.22"

[profile.release]
lto = "thin"
strip = true
