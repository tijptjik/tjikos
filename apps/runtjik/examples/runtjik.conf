# TOML. Reloaded on each opening. /refresh rebuilds discovery while open.
[ui]
keep_alive = true            # Hide instead of quitting; runtjik quit releases RAM
view = "grid"                 # grid or list; Ctrl+L toggles for this session
columns = 5
width = 720
height = 600
icon_size = 52
font = "tijpset"
font_size = 14
monitor = "focused"           # focused, or an output name such as DP-1
max_results = 100

[theme]
background = "#191724"
surface = "#26233a"
tile = "#1f1d2e"
text = "#e0def4"
muted = "#908caa"
accent = "#ff53a6"
border = "#403a52"
icon_theme = "rose-punk-illustrated"

[index]
desktop_apps = true
path_commands = true # Only executables found in saved Fish history
refresh_seconds = 5

[launch]
terminal = ["kitty", "--"]
isolate = true

[history]
enabled = true

[plugins]
enabled = ["Words", "Clipboard", "Recorder", "Screenshots"]           # Add installed providers, e.g. "ZenTabs"

[plugin_settings.Words]
define_sources = ["free_dictionary", "wiktionary"] # Optional: "urban_dictionary"
synonym_sources = ["datamuse", "free_dictionary"]
max_results_per_source = 12
timeout_seconds = 5

# Desktop apps receive an ordinary launch request unless an override is supplied.
# [overrides."apps:firefox.desktop"]
# argv = ["firefox", "--new-window"]
# window_classes = ["firefox"]

[plugin_settings.Clipboard]
max_results = 50

[plugin_settings.Recorder]
directory = "xdg:VIDEOS"
audio = false
fps = 30
countdown_seconds = 3
max_results = 40
gallery_columns = 3
gallery_rows = 3

[plugin_settings.Screenshots]
directory = "xdg:PICTURES/screenshots"
copy_to_clipboard = true
max_results = 40
gallery_columns = 3
gallery_rows = 3
