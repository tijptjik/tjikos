[package]
name = "runtjik-core"
version = "0.8.3"
edition = "2021"
license = "GPL-3.0-or-later"

[features]
gtk-ui = ["dep:gtk", "dep:async-channel", "dep:tjik-gtk", "dep:tasktjik-gtk"]

[[bin]]
name = "runtjik-gtk"
path = "src/gtk/main.rs"
required-features = ["gtk-ui"]

[dependencies]
tjik-desktop = { path = "../../packages/tjik-desktop" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
rusqlite = "0.32"
gio = "0.21"
gdk-pixbuf = "0.21"
libc = "0.2"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
regex = "1"
walkdir = "2"
shlex = "1.3"
url = "2"

tasktjik-api = { path = "../tasktjik" }
tempfile = "3"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
scraper = "0.24"
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"], optional = true }
async-channel = { version = "2.5", optional = true }
tjik-gtk = { path = "../../packages/tjik-gtk", optional = true }
tasktjik-gtk = { path = "../../packages/tasktjik-gtk", optional = true }

[profile.release]
lto = "thin"
strip = true
