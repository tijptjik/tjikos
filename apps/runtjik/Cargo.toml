[package]
name = "runtjik-core"
version = "0.8.3"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = "0.32"
gio = "0.21"
gdk-pixbuf = "0.21"
libc = "0.2"
sha2 = "0.10"
regex = "1"
walkdir = "2"
shlex = "1.3"

[profile.release]
lto = "thin"
strip = true
