[package]
name = "tjikos-oo7-pam"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "oo7 PAM integration for auth-only screen lockers"

[lib]
name = "pam_oo7_tjik"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "pam_test_tokens"
path = "tests/common/tokens.rs"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_repr = "0.1"
tokio = { version = "1.52", default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time"] }
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
zgvariant = { version = "1.0", features = ["serde_bytes"] }

[dev-dependencies]
tempfile = "3.26"
tokio = { version = "1.52", default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
