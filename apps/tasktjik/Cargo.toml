[package]
name = "tasktjik-api"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "0.8"
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["timeout", "limit"] }
uuid = { version = "1", features = ["v4"] }

libc = "0.2"
url = "2"
walkdir = "2"
toml_edit = "0.22"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
