<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasktjik</title><link rel="stylesheet" href="/tasktjik/style.css"><script src="/tasktjik/date-code.js" defer></script><script src="/tasktjik/repeat.js" defer></script><script src="/tasktjik/workflow.js" defer></script><script src="/tasktjik/app.js" defer></script>
<body><main><header><div><span class="eyebrow">YOUR PRIVATE TASK SPACE</span><h1>Tasktjik<span class="dot">.</span></h1></div><button id="new">New task <kbd>n</kbd></button></header>
<nav aria-label="Task views"><button data-view="week" class="active">This week</button><button data-view="today">Today</button><button data-view="month">This month</button><button data-view="all">Later · all tasks</button><button data-view="projects">Projects</button><button id="devices">Devices</button></nav>
<div class="toolbar"><input id="search" type="search" placeholder="Search tasks, tags and groups" aria-label="Search tasks"><button id="show-blocked" aria-label="Show blocked tasks and workflow steps" aria-pressed="false"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 9V7a4 4 0 018 0v2M11 13v3"/><rect x="5" y="9" width="12" height="10" rx="2"/></svg></button><span id="identity"></span></div><div id="project-heading"></div><p id="message" role="status"></p><section id="tasks" class="groups" aria-label="Tasks"></section><footer><button id="settings" aria-label="Settings: groups and templates">⚙</button></footer></main>
<dialog id="editor"><form id="task-form"><header><h2 id="editor-title">New task</h2><button type="button" data-close="editor" aria-label="Close editor">×</button></header><label>Title<input name="title" required maxlength="4096" autofocus></label><div class="fields"><label>Group<input name="group" list="group-options" value="General"><datalist id="group-options"></datalist></label><label>Due<input name="due" type="date"></label></div><label id="template-choice">From Template<select name="template"></select></label><label id="project-choice">Project<select name="project"></select></label><label id="project-visibility" class="check"><input name="onlyInProject" type="checkbox" checked>Only show Project tasks in their project</label><div id="workflow-editor"></div><label>Tags<input name="tags" placeholder="Comma separated"></label><label>Repeat<input name="repeatText" id="repeat-input" placeholder="Every 2 weeks, every Monday, or the 1st of every month"><span id="repeat-summary" hidden></span></label><button id="repeat-edit" type="button" aria-label="Retype repeat schedule" hidden>✎</button><p id="repeat-hint" role="status"></p><label>Reference<input name="reference" placeholder="Plan filename or URL"></label><div class="fields"><label class="check"><input name="notify" type="checkbox" checked> Notify before due</label><label>Lead<input name="lead" type="number" min="0" max="10000" value="1"></label><label>Lead unit<select name="leadUnit"><option>hours</option><option selected>days</option><option>weeks</option></select></label></div><p class="form-error" role="alert"></p><div class="actions"><button type="button" id="cancel-task">Cancel task (C)</button><button type="button" data-close="editor">Close</button><button type="submit" class="primary">Save task</button></div><footer id="task-metadata" aria-label="Task metadata" hidden></footer></form></dialog>
<dialog id="snooze"><header><h2>Snooze reminder</h2><button data-close="snooze" aria-label="Close snooze">×</button></header><div id="presets"></div><form id="snooze-form"><label>Or choose a date<input type="datetime-local" name="until" required></label><p class="form-error" role="alert"></p><button type="submit" class="primary">Snooze</button></form></dialog>
<dialog id="device-dialog"><header><h2>Your devices</h2><button data-close="device-dialog" aria-label="Close devices">×</button></header><p>Only your authenticated identity can access tasks. These switches control reminder delivery, not authentication.</p><div id="device-list"></div></dialog>
<dialog id="settings-dialog"><header><h2>Settings</h2><button data-close="settings-dialog" aria-label="Close settings">×</button></header><div class="actions"><button id="settings-groups">Groups</button><button id="settings-templates">Templates</button><button id="settings-new">+ Group</button></div><p id="settings-hint"></p><div id="settings-list"></div><p class="form-error" role="alert"></p></dialog>
<dialog id="group-dialog"><form id="group-form"><h2 id="group-title"></h2><p id="group-description"></p><label id="group-label">Group name<input id="group-name" maxlength="100"></label><p class="form-error" role="alert"></p><div class="actions"><button type="button" data-close="group-dialog">Cancel</button><button type="submit">Confirm</button></div></form></dialog>
</body></html>
