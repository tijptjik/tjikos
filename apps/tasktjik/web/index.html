<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasktjik</title><link rel="stylesheet" href="/tasktjik/style.css"><script src="/tasktjik/app.js" defer></script>
<body><main><header><div><span class="eyebrow">YOUR PRIVATE TASK SPACE</span><h1>Tasktjik<span class="dot">.</span></h1></div><button id="new">New task <kbd>n</kbd></button></header>
<nav aria-label="Task views"><button data-view="week" class="active">This week</button><button data-view="today">Today</button><button data-view="all">Later · all tasks</button><button id="devices">Devices</button></nav>
<div class="toolbar"><input id="search" type="search" placeholder="Search tasks, tags and groups" aria-label="Search tasks"><span id="identity"></span></div><p id="message" role="status"></p><section id="tasks" class="groups" aria-label="Tasks"></section><footer>Private to your Tailscale identity · Changes saved on Si</footer></main>
<dialog id="editor"><form id="task-form"><header><h2 id="editor-title">New task</h2><button type="button" data-close="editor" aria-label="Close editor">×</button></header><label>Title<input name="title" required maxlength="4096" autofocus></label><div class="fields"><label>Group<input name="group" list="group-options" value="General"><datalist id="group-options"></datalist></label><label>Due<input name="due" type="date"></label></div><label>Tags<input name="tags" placeholder="Comma separated"></label><div class="fields"><label>Repeat<select name="unit"><option value="">Does not repeat</option>days</option><option>weeks</option><option>months</option><option>years</option><option>days-of-the-week</option><option>days-of-the-month</option></select></label><label>Interval / day numbers<input name="value" value="1" placeholder="1 or 1,3,5"></label></div><label>Reference<input name="reference" placeholder="Plan filename or URL"></label><div class="fields"><label class="check"><input name="notify" type="checkbox" checked> Notify before due</label><label>Lead<input name="lead" type="number" min="0" max="10000" value="1"></label><label>Lead unit<select name="leadUnit"><option>hours</option><option selected>days</option><option>weeks</option></select></label></div><p class="form-error" role="alert"></p><div class="actions"><button type="button" data-close="editor">Cancel</button><button type="submit" class="primary">Save task</button></div></form></dialog>
<dialog id="snooze"><header><h2>Snooze reminder</h2><button data-close="snooze" aria-label="Close snooze">×</button></header><div id="presets"></div><form id="snooze-form"><label>Or choose a date<input type="datetime-local" name="until" required></label><p class="form-error" role="alert"></p><button type="submit" class="primary">Snooze</button></form></dialog>
<dialog id="device-dialog"><header><h2>Your devices</h2><button data-close="device-dialog" aria-label="Close devices">×</button></header><p>Only your authenticated identity can access tasks. These switches control reminder delivery, not authentication.</p><div id="device-list"></div></dialog>
</body></html>
