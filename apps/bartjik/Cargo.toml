[package]
name = "bartjik-core"
version = "0.1.0"
edition = "2021"

[features]
gtk-ui = ["dep:tjik-gtk", "dep:gtk4-layer-shell", "dep:async-channel"]

[[bin]]
name = "bartjik-gtk"
path = "src/gtk/main.rs"
required-features = ["gtk-ui"]

[dependencies]
tjik-desktop = { path = "../../packages/tjik-desktop" }
tjik-gtk = { path = "../../packages/tjik-gtk", optional = true }
gtk4-layer-shell = { version = "0.7", optional = true }
async-channel = { version = "2.5", optional = true }
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
unicode-normalization = "0.1"
regex = "1"
libc = "0.2"
chrono = "0.4"
chrono-tz = "0.10"
rusqlite = { version = "0.32", features = ["hooks"] }
tempfile = "3"
url = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
gio = "0.21"

[profile.release]
lto = "thin"
strip = true
